version: '3.8'

services:
  acowale-pulse-crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acowale-pulse-crm-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./prod.db
      - JWT_SECRET=acowale_super_secret_jwt_key_2026
      - CORS_ORIGIN=*
      - RATE_LIMIT_MAX=200
    volumes:
      - crm_data:/app/server
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  crm_data:
